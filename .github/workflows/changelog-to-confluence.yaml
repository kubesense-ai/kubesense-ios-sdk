name: Publish Changelog and Feature Docs to Confluence
on:
    push:
        branches:
            - master
        paths:
            - 'CHANGELOG.md'
            - 'KubesenseRUM/RUM_FEATURE.md'
            - 'KubesenseSessionReplay/SESSION_REPLAY_FEATURE.md'
            - 'KubesenseTrace/TRACE_FEATURE.md'
            - 'KubesenseProfiling/PROFILING_FEATURE.md'
            - 'KubesenseLogs/LOGS_FEATURE.md'
permissions:
    contents: read
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Prepare Changelog and Feature Docs
              run: |
                  mkdir -p publish_folder
                  cp CHANGELOG.md publish_folder/kubesense-ios-sdk-changelog.md
                  echo "Publishing CHANGELOG.md"

                  cp KubesenseRUM/RUM_FEATURE.md publish_folder/kubesense-ios-sdk-rum-feature.md
                  echo "Publishing RUM_FEATURE.md"

                  cp KubesenseSessionReplay/SESSION_REPLAY_FEATURE.md publish_folder/kubesense-ios-sdk-session-replay-feature.md
                  echo "Publishing SESSION_REPLAY_FEATURE.md"

                  cp KubesenseTrace/TRACE_FEATURE.md publish_folder/kubesense-ios-sdk-trace-feature.md
                  echo "Publishing TRACE_FEATURE.md"

                  cp KubesenseProfiling/PROFILING_FEATURE.md publish_folder/kubesense-ios-sdk-profiling-feature.md
                  echo "Publishing PROFILING_FEATURE.md"

                  cp KubesenseLogs/LOGS_FEATURE.md publish_folder/kubesense-ios-sdk-logs-feature.md
                  echo "Publishing LOGS_FEATURE.md"

            - name: Publish Markdown to Confluence
              uses: markdown-confluence/publish-action@7767a0a7f438bb1497ee7ffd7d3d685b81dfe700 # v5
              with:
                  confluenceBaseUrl: ${{ secrets.KUBESENSE_CONFLUENCE_BASE_URL }}
                  confluenceParentId: ${{ secrets.CONFLUENCE_PARENT_ID }}
                  atlassianUserName: ${{ secrets.CONFLUENCE_ROBOT_RUM_EMAIL }}
                  atlassianApiToken: ${{ secrets.CONFLUENCE_ROBOT_RUM_API_KEY }}
                  contentRoot: '.'
                  folderToPublish: 'publish_folder'
